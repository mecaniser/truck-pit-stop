<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — before and after</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#e9eff6;font:15px system-ui}header{padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}p{margin:0;color:#aabccc}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;padding:9px 14px;background:#17283c;color:inherit;border:1px solid #41566f;border-radius:6px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#087d96}main{padding:0 24px 24px}.controls{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}input{flex:1;min-width:160px}.stage{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;background:#0b1929}.stage img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.after{clip-path:inset(0 0 0 var(--split,50%))}.line{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#35d3ee;pointer-events:none}.tag{position:absolute;top:8px;padding:5px 10px;background:#07111ee8;border:1px solid #52677e;border-radius:4px}.before-tag{left:8px}.after-tag{right:8px}small{color:#aabccc}
</style><header><h1>Workspace: before / after</h1><p>1600 × 1000 · Same data, theme, expanded sidebar and browser scale.</p><a href="/dashboard/garage/inventory">Open working app</a></header><main><nav aria-label="Area"><button data-area="parts" aria-pressed="true">Parts</button><button data-area="customers" aria-pressed="false">Customers</button><button data-area="repairs" aria-pressed="false">Repair Orders</button><button data-area="shop-work" aria-pressed="false">Shop Work</button></nav><div class="controls"><button id="before">Show before</button><label for="split">Compare</label><input id="split" aria-label="Before and after divider" type="range" min="0" max="100" value="50"><button id="after">Show after</button></div><div class="stage"><img id="old" alt="Original workspace before changes"><img id="new" class="after" alt="Expanded workspace after changes"><div class="line"></div><span class="tag before-tag">Before</span><span class="tag after-tag">After</span></div><p><small>Before: original main stylesheet. After: one 12px gutter, no workspace frame; consistent soft list and row corners. Fictional records. Nothing deployed.</small></p></main><script>
const base="/tests/db150";const range=document.querySelector('#split');const stage=document.querySelector('.stage');function split(value){range.value=value;stage.style.setProperty('--split',value+'%')}function area(name){document.querySelector('#old').src=base+'/'+name+'-before.png';document.querySelector('#new').src=base+'/'+name+'-after.png?v=rounded-all';document.querySelectorAll('[data-area]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.area===name)))}document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>area(b.dataset.area));range.oninput=()=>split(range.value);document.querySelector('#before').onclick=()=>split(100);document.querySelector('#after').onclick=()=>split(0);area('parts');
</script></html>
