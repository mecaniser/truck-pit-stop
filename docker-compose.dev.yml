services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: dieselbridge_api_dev
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dieselbridge:dieselbridge_dev@postgres:5432/${DIESELBRIDGE_LOCAL_DB_NAME:-truckpitstop}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS_STR: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: dieselbridge_worker_dev
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dieselbridge:dieselbridge_dev@postgres:5432/${DIESELBRIDGE_LOCAL_DB_NAME:-truckpitstop}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS_STR: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: dieselbridge_beat_dev
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dieselbridge:dieselbridge_dev@postgres:5432/${DIESELBRIDGE_LOCAL_DB_NAME:-truckpitstop}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS_STR: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
