name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-graph:
    name: Migration graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alembic
        run: python -m pip install --upgrade pip alembic==1.12.1 sqlalchemy==2.0.23
      - name: Verify one Alembic head
        run: python backend/scripts/check_alembic_heads.py

  backend-tests:
    name: Backend tests
    needs: migration-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/scripts
      - name: Run critical regression suite
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_schema_preflight.py \
            tests/test_database_resilience.py \
            tests/test_dashboard_performance.py \
            tests/test_dashboard_zelle_queue.py \
            tests/test_fleet_board.py \
            tests/test_fleet_board_projection.py \
            tests/test_ro_pricing_discounts.py \
            tests/test_workspace_typeaheads.py \
            tests/test_request_performance.py

  backend-full-suite:
    name: Backend full suite (informational)
    needs: migration-graph
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run full backend suite
        working-directory: backend
        run: python -m pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint changed frontend files
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run lint:changed
      - name: Run critical regression suite
        working-directory: frontend
        run: npm run test:critical
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  frontend-full-suite:
    name: Frontend full suite (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run full frontend suite
        working-directory: frontend
        run: npm test -- --run
