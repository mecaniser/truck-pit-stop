name: Quality gates

on:
  pull_request:
    branches: [main]
  # Protected, up-to-date PR checks are the merge gate. Avoid a second full
  # run for the same merged tree; scheduled/manual runs provide full regression.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-graph:
    name: Migration graph
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      frontend_required: ${{ steps.scope.outputs.frontend_required }}
      smoke_required: ${{ steps.scope.outputs.smoke_required }}
    # Scope and safety contracts must not queue behind long application suites.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify PR changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            # The PR checkout is untrusted. Execute the classifier from the
            # protected base commit, never from the proposed PR files.
            if git cat-file -e "$BASE_SHA:.github/scripts/ci_scope.py" 2>/dev/null; then
              git show "$BASE_SHA:.github/scripts/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
              python "$RUNNER_TEMP/ci_scope.py" --base "$BASE_SHA" --head "$HEAD_SHA" | tee "$GITHUB_OUTPUT"
            else
              printf '%s\n' 'backend_required=true' 'frontend_required=true' 'smoke_required=true' | tee "$GITHUB_OUTPUT"
              echo 'reason=trusted classifier unavailable; fail closed' | tee -a "$GITHUB_OUTPUT"
            fi
          else
            printf '%s\n' 'backend_required=true' 'frontend_required=true' 'smoke_required=true' | tee "$GITHUB_OUTPUT"
            echo 'reason=scheduled or manual full regression' | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Verify backend test partitions and scope guards
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Install Alembic
        run: python -m pip install --upgrade pip alembic==1.12.1 sqlalchemy==2.0.23
      - name: Verify one Alembic head
        run: python backend/scripts/check_alembic_heads.py
      - name: Verify Motive driver collector contracts
        run: node --test backend/scripts/motive_drivers/collect.test.cjs
      - name: Verify ETS contact evidence contracts
        run: node --test backend/scripts/easytruck_sync/lib/contact_snapshot.test.js
      - name: Verify Motive location and speed collector contracts
        run: node --test backend/scripts/motive_sync/collector.test.cjs backend/scripts/motive_sync/tasks.test.cjs backend/scripts/motive_sync/login_diagnostics.test.cjs
      - name: Verify Railway deployment readiness
        run: |
          python .github/scripts/check_railway_config.py
          curl --fail --location --silent --show-error \
            https://railway.com/railway.schema.json \
            --output /tmp/railway.schema.json
          npx --yes ajv-cli@5.0.0 validate \
            --spec=draft2020 \
            -s /tmp/railway.schema.json \
            -d railway.json

  backend-tests:
    name: Backend tests
    needs: migration-graph
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.backend_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Scoped PR; backend suite not affected
        if: needs.migration-graph.outputs.backend_required == 'false'
        run: echo 'Backend pytest omitted by trusted frontend/Markdown scope; scheduled/manual regression runs all suites.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.backend_required != 'false'
      - uses: actions/setup-python@v5
        if: needs.migration-graph.outputs.backend_required != 'false'
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: needs.migration-graph.outputs.backend_required != 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        if: needs.migration-graph.outputs.backend_required != 'false'
        run: python -m compileall -q backend/app backend/scripts
      - name: Verify backend test partition coverage
        if: needs.migration-graph.outputs.backend_required != 'false'
        working-directory: backend
        run: python ../.github/scripts/run_backend_tests.py verify
      - name: Run critical regression suite
        if: needs.migration-graph.outputs.backend_required != 'false'
        working-directory: backend
        run: |
          python ../.github/scripts/run_backend_tests.py critical

  backend-full-suite:
    name: Backend full suite (informational)
    needs: migration-graph
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.backend_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Scoped PR; backend suite not affected
        if: needs.migration-graph.outputs.backend_required == 'false'
        run: echo 'Remaining backend pytest omitted by trusted frontend/Markdown scope; scheduled/manual regression runs all suites.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.backend_required != 'false'
      - uses: actions/setup-python@v5
        if: needs.migration-graph.outputs.backend_required != 'false'
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: needs.migration-graph.outputs.backend_required != 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run full backend suite
        if: needs.migration-graph.outputs.backend_required != 'false'
        working-directory: backend
        run: python ../.github/scripts/run_backend_tests.py remaining

  frontend-dependencies:
    name: Prepare frontend dependencies
    needs: migration-graph
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.frontend_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Markdown-only PR; application suite not affected
        if: needs.migration-graph.outputs.frontend_required == 'false'
        run: echo 'Application suite omitted by trusted Markdown-only scope; safety contracts still run.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
      - uses: actions/setup-node@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        # Keep clean install, lockfile integrity, lifecycle scripts and audit.
        # Prefer verified cached tarballs; fetch normally when missing.
        run: npm ci --prefer-offline
      - name: Package exact-run frontend installation
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node scripts/ci-dependencies.mjs pack "$RUNNER_TEMP/frontend-dependencies"
      - uses: actions/upload-artifact@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          name: frontend-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dependencies
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  frontend-checks:
    name: Frontend checks
    needs: [migration-graph, frontend-dependencies]
    # A failed preparation must FAIL a required context, never merely skip it.
    if: always() && !cancelled()
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.frontend_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Require successful prerequisites
        env:
          SCOPE_RESULT: ${{ needs.migration-graph.result }}
          INSTALL_RESULT: ${{ needs.frontend-dependencies.result }}
        run: test "$SCOPE_RESULT" = success && test "$INSTALL_RESULT" = success
      - name: Markdown-only PR; application suite not affected
        if: needs.migration-graph.outputs.frontend_required == 'false'
        run: echo 'Application suite omitted by trusted Markdown-only scope; safety contracts still run.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          name: frontend-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dependencies
      - name: Restore verified frontend installation
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node scripts/ci-dependencies.mjs restore "$RUNNER_TEMP/frontend-dependencies"
      - name: Lint changed frontend files
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run lint:changed
      - name: Verify frontend test partition coverage
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node --test scripts/verify-partition-guards.mjs scripts/verify-ci-dependencies.mjs scripts/verify-build-ci.mjs && node scripts/verify-test-partitions.mjs
      - name: Run critical regression suite
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: npm run test:critical
      - name: Build production bundle
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node scripts/build-ci.mjs

  frontend-full-suite:
    name: Frontend full suite (informational)
    needs: [migration-graph, frontend-dependencies]
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.frontend_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Markdown-only PR; application suite not affected
        if: needs.migration-graph.outputs.frontend_required == 'false'
        run: echo 'Application suite omitted by trusted Markdown-only scope; safety contracts still run.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
      - uses: actions/setup-node@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        if: needs.migration-graph.outputs.frontend_required != 'false'
        with:
          name: frontend-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dependencies
      - name: Restore verified frontend installation
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node scripts/ci-dependencies.mjs restore "$RUNNER_TEMP/frontend-dependencies"
      - name: Run full frontend suite
        if: needs.migration-graph.outputs.frontend_required != 'false'
        working-directory: frontend
        run: node scripts/run-remaining-tests.mjs

  playwright-smoke:
    name: Playwright smoke
    needs: [migration-graph, frontend-checks, backend-tests]
    # PRs use standard hosted capacity; local slots serve scheduled/manual
    # regression only. VM isolation remains the local security boundary.
    runs-on: ${{ fromJSON(needs.migration-graph.outputs.smoke_required != 'false' && github.event_name != 'pull_request' && '["self-hosted", "Linux", "ARM64", "dieselbridge-local"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 25
    services:
      postgres:
        image: ${{ needs.migration-graph.outputs.smoke_required != 'false' && 'docker.io/library/postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c' || '' }}
        env:
          POSTGRES_DB: playwright_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d playwright_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ needs.migration-graph.outputs.smoke_required != 'false' && 'docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/playwright_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: playwright-ci-only-secret-key-0000000000000000
      ENVIRONMENT: test
      WORKOS_AUTH_ENABLED: 'false'
    steps:
      - name: Markdown-only PR; application suite not affected
        if: needs.migration-graph.outputs.smoke_required == 'false'
        run: echo 'Application suite omitted by trusted Markdown-only scope; safety contracts still run.'
      - uses: actions/checkout@v4
        if: needs.migration-graph.outputs.smoke_required != 'false'
      - uses: actions/setup-python@v5
        if: needs.migration-graph.outputs.smoke_required != 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints-test.txt
      - uses: actions/setup-node@v4
        if: needs.migration-graph.outputs.smoke_required != 'false'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install backend dependencies
        if: needs.migration-graph.outputs.smoke_required != 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -c backend/constraints-test.txt
      - uses: actions/download-artifact@v4
        if: needs.migration-graph.outputs.smoke_required != 'false'
        with:
          name: frontend-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-dependencies
      - name: Restore verified frontend installation
        if: needs.migration-graph.outputs.smoke_required != 'false'
        working-directory: frontend
        run: node scripts/ci-dependencies.mjs restore "$RUNNER_TEMP/frontend-dependencies"
      - name: Install Playwright dependencies
        if: needs.migration-graph.outputs.smoke_required != 'false'
        working-directory: e2e
        run: |
          npm ci
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            # Matching OS dependencies are baked into the pristine VM image;
            # job users deliberately cannot sudo or modify that base image.
            npx playwright install --only-shell chromium
          else
            # The Azure Ubuntu mirror can stall package downloads on hosted
            # runners. Keep Ubuntu's signed packages and use its HTTPS archive.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            npx playwright install --with-deps --only-shell chromium
          fi
      - name: Prepare isolated test database
        if: needs.migration-graph.outputs.smoke_required != 'false'
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run Playwright smoke suite
        if: needs.migration-graph.outputs.smoke_required != 'false'
        timeout-minutes: 5
        working-directory: e2e
        run: npm run test:smoke
      - name: Upload Playwright diagnostics on failure
        if: needs.migration-graph.outputs.smoke_required != 'false' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-diagnostics
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
