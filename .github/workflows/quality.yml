name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-graph:
    name: Migration graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alembic
        run: python -m pip install --upgrade pip alembic==1.12.1 sqlalchemy==2.0.23
      - name: Verify one Alembic head
        run: python backend/scripts/check_alembic_heads.py
      - name: Verify Railway deployment readiness
        run: |
          python .github/scripts/check_railway_config.py
          curl --fail --location --silent --show-error \
            https://railway.com/railway.schema.json \
            --output /tmp/railway.schema.json
          npx --yes ajv-cli@5.0.0 validate \
            --spec=draft2020 \
            -s /tmp/railway.schema.json \
            -d railway.json

  backend-tests:
    name: Backend tests
    needs: migration-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/scripts
      - name: Run critical regression suite
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_schema_preflight.py \
            tests/test_database_resilience.py \
            tests/test_dashboard_performance.py \
            tests/test_dashboard_zelle_queue.py \
            tests/test_fleet_board.py \
            tests/test_fleet_board_projection.py \
            tests/test_ro_pricing_discounts.py \
            tests/test_workspace_typeaheads.py \
            tests/test_request_performance.py

  backend-full-suite:
    name: Backend full suite (informational)
    needs: migration-graph
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run full backend suite
        working-directory: backend
        run: python -m pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint changed frontend files
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run lint:changed
      - name: Run critical regression suite
        working-directory: frontend
        run: npm run test:critical
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  frontend-full-suite:
    name: Frontend full suite (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run full frontend suite
        working-directory: frontend
        run: npm test -- --run

  playwright-smoke:
    name: Playwright smoke
    needs: migration-graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: playwright_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d playwright_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/playwright_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: playwright-ci-only-secret-key-0000000000000000
      ENVIRONMENT: test
      WORKOS_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -c backend/constraints-test.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare isolated test database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run Playwright smoke suite
        working-directory: e2e
        run: npm run test:smoke
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-diagnostics
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
