<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Diesel Bridge Network logo system Bridge Span</title>
  <desc id="desc">Bridge-led network logo with four nodes and a central coordination hub.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F7" />
    </linearGradient>
    <style>
      .title {
        font-family: "Bebas Neue", "Oswald", "Impact", sans-serif;
        font-size: 112px;
        letter-spacing: 0.03em;
        fill: #102A43;
      }
      .sub {
        font-family: "Rajdhani", "Barlow Condensed", sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.24em;
        fill: #334E68;
      }
      .tag {
        font-family: "Public Sans", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #486581;
      }
      .small {
        font-family: "Rajdhani", "Barlow Condensed", sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        fill: #334E68;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="420" fill="url(#panel)" />

  <g transform="translate(70,78)">
    <rect x="0" y="0" width="250" height="250" rx="44" fill="#13233D" />

    <path d="M34 126 C72 72 178 72 216 126" fill="none" stroke="#F97316" stroke-width="12" stroke-linecap="round" />
    <path d="M34 126 C72 180 178 180 216 126" fill="none" stroke="#264763" stroke-width="12" stroke-linecap="round" />
    <path d="M60 126 L190 126" fill="none" stroke="#F9FAFB" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10" />

    <circle cx="28" cy="52" r="11" fill="#F97316" />
    <circle cx="222" cy="52" r="11" fill="#F97316" />
    <circle cx="28" cy="198" r="11" fill="#F97316" />
    <circle cx="222" cy="198" r="11" fill="#F97316" />
    <circle cx="125" cy="126" r="14" fill="#F9FAFB" />

    <path d="M38 60 L114 115" fill="none" stroke="#9FB3C8" stroke-width="4" stroke-linecap="round" />
    <path d="M212 60 L136 115" fill="none" stroke="#9FB3C8" stroke-width="4" stroke-linecap="round" />
