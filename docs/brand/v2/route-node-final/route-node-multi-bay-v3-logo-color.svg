<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Diesel Bridge Network Route Node Multi-Bay v3 logo</title>
  <desc id="desc">Minimal top-view garage with trucks approaching bay entrances from all directions.</desc>

  <defs>
    <style>
      .title {
        font-family: "Saira Condensed", "Rajdhani", sans-serif;
        font-size: 100px;
        font-weight: 700;
        letter-spacing: 0.02em;
        fill: #0B1220;
      }
      .sub {
        font-family: "IBM Plex Sans Condensed", "Barlow Condensed", sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.24em;
        fill: #1D4ED8;
      }
      .tag {
        font-family: "Public Sans", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #334155;
      }
      .lane {
        fill: #3B455D;
      }
      .lane-diag {
        fill: #313B52;
      }
    </style>

    <g id="truckGlyph">
      <rect x="-20" y="-7.5" width="30" height="15" rx="2.4" fill="#F5B54A" />
      <rect x="10" y="-6" width="10" height="12" rx="2" fill="#D9962B" />
      <rect x="12.3" y="-3.7" width="5.2" height="3.6" rx="0.9" fill="#0E1424" />
      <circle cx="-12.5" cy="8.2" r="1.9" fill="#1F2937" />
      <circle cx="-2.5" cy="8.2" r="1.9" fill="#1F2937" />
      <circle cx="13.5" cy="8.2" r="1.9" fill="#1F2937" />
    </g>
  </defs>

  <g transform="translate(52,58)">
    <rect x="0" y="0" width="304" height="304" rx="56" fill="#071427" />

    <rect x="134" y="0" width="36" height="84" class="lane" />
    <rect x="134" y="220" width="36" height="84" class="lane" />
    <rect x="0" y="134" width="84" height="36" class="lane" />
    <rect x="220" y="134" width="84" height="36" class="lane" />

    <polygon points="0,0 44,0 108,84 84,108" class="lane-diag" />
    <polygon points="304,0 260,0 196,84 220,108" class="lane-diag" />
    <polygon points="0,304 44,304 108,220 84,196" class="lane-diag" />
    <polygon points="304,304 260,304 196,220 220,196" class="lane-diag" />

    <rect x="92" y="92" width="120" height="120" rx="22" fill="#0B1220" stroke="#465672" stroke-width="5" />

    <rect x="134" y="84" width="36" height="11" rx="3" fill="#22D3EE" />
    <rect x="209" y="134" width="11" height="36" rx="3" fill="#22D3EE" />
    <rect x="134" y="209" width="36" height="11" rx="3" fill="#22D3EE" />
    <rect x="84" y="134" width="11" height="36" rx="3" fill="#22D3EE" />

    <rect x="110" y="147" width="84" height="10" rx="5" fill="#22D3EE" opacity="0.9" />

    <use href="#truckGlyph" transform="translate(152,36) rotate(90) scale(1.02)" />
    <use href="#truckGlyph" transform="translate(268,152) rotate(180) scale(1.02)" />
    <use href="#truckGlyph" transform="translate(152,268) rotate(-90) scale(1.02)" />
    <use href="#truckGlyph" transform="translate(36,152) rotate(0) scale(1.02)" />

    <use href="#truckGlyph" transform="translate(62,62) rotate(45) scale(0.88)" />
    <use href="#truckGlyph" transform="translate(242,62) rotate(135) scale(0.88)" />
    <use href="#truckGlyph" transform="translate(242,242) rotate(-135) scale(0.88)" />
    <use href="#truckGlyph" transform="translate(62,242) rotate(-45) scale(0.88)" />
  </g>

  <g transform="translate(398,98)">
    <text x="0" y="104" class="title">Diesel Bridge</text>
    <text x="8" y="146" class="sub">NETWORK</text>
    <text x="8" y="194" class="tag">Multi-bay orchestration with all-direction truck intake.</text>
  </g>
</svg>
